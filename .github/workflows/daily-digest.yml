name: Daily Energy Brief

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past (less crowded than :00)
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write

# If one run is still going when the next one starts, wait instead of clashing.
concurrency:
  group: energy-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser

      - name: Build the page
        run: python energy_news.py
        env:
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_PASS: ${{ secrets.DIGEST_EMAIL_PASS }}

      - name: Publish the updated page
        run: |
          git config user.name "energy-brief-bot"
          git config user.email "energy-brief-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Brief for $(date -u +'%F %H:%M') UTC" || echo "No changes"
          git push
